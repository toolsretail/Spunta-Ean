<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Carico Merci</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTML5 QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* Personalizzazioni aggiuntive per un look più nativo */
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        
        /* Nasconde le scrollbar per un look più pulito */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Toast animation */
        .toast-enter {
            opacity: 1;
            transform: translateY(0);
        }
        .toast-exit {
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col items-center p-4 sm:p-8">

    <!-- Header -->
    <header class="w-full max-w-lg mb-6 text-center">
        <h1 class="text-3xl font-extrabold text-indigo-600 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
            Conta EAN
        </h1>
        <p class="text-slate-500 text-sm mt-1">Gestione rapida carico merci</p>
    </header>

    <!-- App Container -->
    <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden flex-grow flex flex-col relative">
        
        <!-- ==================== FASE DI SCANSIONE ==================== -->
        <div id="scanning-phase" class="flex flex-col h-full p-6">
            
            <!-- Input Principale per Pistola Barcode -->
            <div class="mb-6">
                <label for="ean-input" class="block text-sm font-semibold text-slate-700 mb-2">Spara il codice con la pistola</label>
                <div class="relative">
                    <!-- inputmode="none" previene l'apertura della tastiera su mobile, utile se si usa scanner bluetooth -->
                    <input type="text" id="ean-input" autofocus inputmode="none" placeholder="Attendo codice..." 
                        class="w-full pl-12 pr-4 py-4 bg-slate-50 border-2 border-indigo-100 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors text-lg font-mono placeholder-slate-400">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Divisore -->
            <div class="flex items-center mb-6">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="mx-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Oppure</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Lettore Fotocamera Smartphone -->
            <button id="toggle-camera-btn" class="w-full mb-4 flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white py-3 px-4 rounded-xl font-medium transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span id="camera-btn-text">Usa Fotocamera Telefono</span>
            </button>
            <div id="reader-container" class="hidden mb-6 rounded-xl overflow-hidden border-2 border-slate-200 bg-black">
                <div id="reader" class="w-full"></div>
            </div>

            <!-- Feedback Ultime Scansioni -->
            <div class="flex-grow bg-slate-50 rounded-xl p-4 flex flex-col justify-center items-center text-center border border-slate-100 mb-6">
                <p class="text-sm text-slate-500 mb-1">Ultimo codice acquisito:</p>
                <p id="last-scanned-code" class="text-2xl font-bold font-mono text-indigo-600 h-8">-</p>
                <div class="mt-4 flex gap-4">
                    <div class="flex flex-col items-center">
                        <span class="text-xs text-slate-400 uppercase font-semibold">Articoli Univoci</span>
                        <span id="unique-count" class="text-lg font-bold text-slate-700">0</span>
                    </div>
                    <div class="w-px bg-slate-300"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-xs text-slate-400 uppercase font-semibold">Totale Pezzi</span>
                        <span id="total-count" class="text-lg font-bold text-slate-700">0</span>
                    </div>
                </div>
            </div>

            <!-- Pulsante Fine -->
            <button id="finish-btn" class="w-full mt-auto bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-4 px-6 rounded-xl shadow-lg shadow-green-200 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Fine Scansione
            </button>
        </div>

        <!-- ==================== FASE DI RIEPILOGO ==================== -->
        <div id="summary-phase" class="hidden flex-col h-full bg-slate-50">
            <div class="p-6 pb-4 bg-white border-b border-slate-100 flex justify-between items-center sticky top-0 shadow-sm z-10">
                <h2 class="text-xl font-bold text-slate-800">Riepilogo Carico</h2>
                <span id="summary-total-badge" class="bg-indigo-100 text-indigo-700 py-1 px-3 rounded-full text-sm font-bold">0 pz</span>
            </div>
            
            <!-- Lista Raggruppata -->
            <div class="flex-grow overflow-y-auto p-6">
                <ul id="summary-list" class="space-y-3">
                    <!-- Gli elementi verranno iniettati via JS -->
                </ul>
            </div>

            <!-- Azioni Finali -->
            <div class="p-6 bg-white border-t border-slate-100 grid grid-cols-2 gap-4">
                <button id="export-btn" class="flex flex-col items-center justify-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-medium transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    <span class="text-sm">Copia Dati</span>
                </button>
                <button id="reset-btn" class="flex flex-col items-center justify-center gap-1 bg-red-50 hover:bg-red-100 text-red-600 py-3 rounded-xl font-medium transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span class="text-sm">Nuovo Carico</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 opacity-0 translate-y-full pointer-events-none">
        <div id="toast-message" class="bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm text-center whitespace-nowrap">
            Messaggio
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // Variabile per memorizzare il Wake Lock
let wakeLock = null;

// Funzione per richiedere di mantenere lo schermo acceso
async function requestWakeLock() {
    try {
        // Verifica se il browser supporta la funzione
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Schermo sempre attivo attivato.');
            
            wakeLock.addEventListener('release', () => {
                console.log('Schermo sempre attivo disattivato.');
            });
        }
    } catch (err) {
        console.error(`Errore Wake Lock: ${err.name}, ${err.message}`);
    }
}

// 1. Attiva il blocco appena la pagina viene caricata
document.addEventListener('DOMContentLoaded', () => {
    requestWakeLock();
});

// 2. Se abbassi l'app a icona per rispondere a un messaggio e poi la riapri,
// il sistema operativo revoca il blocco. Questo lo riattiva in automatico.
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        requestWakeLock();
    }
});
        // Stato dell'applicazione
        const state = {
            eanCounts: {}, // Formato: { "123456789": 5, "987654321": 2 }
            totalScans: 0,
            isCameraActive: false
        };

        // Elementi DOM
        const els = {
            input: document.getElementById('ean-input'),
            lastScanned: document.getElementById('last-scanned-code'),
            uniqueCount: document.getElementById('unique-count'),
            totalCount: document.getElementById('total-count'),
            
            toggleCameraBtn: document.getElementById('toggle-camera-btn'),
            cameraBtnText: document.getElementById('camera-btn-text'),
            readerContainer: document.getElementById('reader-container'),
            
            finishBtn: document.getElementById('finish-btn'),
            exportBtn: document.getElementById('export-btn'),
            resetBtn: document.getElementById('reset-btn'),
            
            scanPhase: document.getElementById('scanning-phase'),
            summaryPhase: document.getElementById('summary-phase'),
            summaryList: document.getElementById('summary-list'),
            summaryTotalBadge: document.getElementById('summary-total-badge'),

            toastContainer: document.getElementById('toast-container'),
            toastMessage: document.getElementById('toast-message')
        };

        let html5QrCode = null;
        let toastTimeout = null;

        // Inizializzazione
        function init() {
            bindEvents();
            maintainFocus();
        }

        function bindEvents() {
            // Evento per la pistola barcode (simula pressione tasti + Invio)
            els.input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const code = els.input.value.trim();
                    if (code) {
                        processBarcode(code);
                    }
                }
            });

            // Assicura che cliccando ovunque nella schermata di scansione si torni sull'input
            els.scanPhase.addEventListener('click', (e) => {
                // Non forzare il focus se l'utente clicca su pulsanti
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                    maintainFocus();
                }
            });

            els.toggleCameraBtn.addEventListener('click', toggleCamera);
            els.finishBtn.addEventListener('click', showSummary);
            els.resetBtn.addEventListener('click', resetApp);
            els.exportBtn.addEventListener('click', exportData);
        }

        // Mantiene il focus sull'input per la pistola
        function maintainFocus() {
            if (!state.isCameraActive && els.scanPhase.style.display !== 'none') {
                els.input.focus();
            }
        }

        // Funzione per mostrare messaggi non bloccanti
        function showToast(message, type = 'normal') {
            els.toastMessage.textContent = message;
            
            if (type === 'error') els.toastMessage.className = 'bg-red-600 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm text-center whitespace-nowrap';
            else if (type === 'success') els.toastMessage.className = 'bg-green-600 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm text-center whitespace-nowrap';
            else els.toastMessage.className = 'bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm text-center whitespace-nowrap';

            els.toastContainer.classList.remove('opacity-0', 'translate-y-full');
            els.toastContainer.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                els.toastContainer.classList.remove('opacity-100', 'translate-y-0');
                els.toastContainer.classList.add('opacity-0', 'translate-y-full');
            }, 3000);
        }

        // Elabora il codice scansionato
        function processBarcode(code) {
            // Aggiorna lo stato
            if (state.eanCounts[code]) {
                state.eanCounts[code]++;
            } else {
                state.eanCounts[code] = 1;
            }
            state.totalScans++;

            // Aggiorna UI
            els.lastScanned.textContent = code;
            
            // Effetto flash per feedback visivo
            els.lastScanned.classList.remove('text-indigo-600');
            els.lastScanned.classList.add('text-green-500', 'scale-110');
            setTimeout(() => {
                els.lastScanned.classList.remove('text-green-500', 'scale-110');
                els.lastScanned.classList.add('text-indigo-600');
            }, 200);

            els.uniqueCount.textContent = Object.keys(state.eanCounts).length;
            els.totalCount.textContent = state.totalScans;

            // Pulisce e ripristina input
            els.input.value = '';
            maintainFocus();

            // Feedback aptico se disponibile su mobile
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Gestione Fotocamera con html5-qrcode
        async function toggleCamera() {
            if (state.isCameraActive) {
                // Ferma fotocamera
                try {
                    await html5QrCode.stop();
                    state.isCameraActive = false;
                    els.cameraBtnText.textContent = 'Usa Fotocamera Telefono';
                    els.readerContainer.classList.add('hidden');
                    maintainFocus();
                } catch (err) {
                    console.error("Errore stop fotocamera:", err);
                }
            } else {
                // Avvia fotocamera
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                
                els.readerContainer.classList.remove('hidden');
                
                try {
                    await html5QrCode.start(
                        { facingMode: "environment" }, // Usa telecamera posteriore
                        {
                            fps: 10,
                            qrbox: { width: 250, height: 150 },
                            aspectRatio: 1.0
                        },
                        (decodedText) => {
                            // Previene scansioni multiple identiche in un millisecondo
                            if(els.lastScanned.textContent !== decodedText) {
                                processBarcode(decodedText);
                                showToast(`Scansionato: ${decodedText}`);
                            }
                        },
                        (errorMessage) => {
                            // Ignora errori di parsing continui mentre cerca il codice
                        }
                    );
                    state.isCameraActive = true;
                    els.cameraBtnText.textContent = 'Chiudi Fotocamera';
                    els.input.blur(); // Rimuove focus dall'input testuale
                } catch (err) {
                    console.error("Camera error:", err);
                    els.readerContainer.classList.add('hidden');
                    showToast("Impossibile accedere alla fotocamera. Verifica i permessi.", 'error');
                }
            }
        }

        // Passa alla schermata di riepilogo
        async function showSummary() {
            if (state.totalScans === 0) {
                showToast("Nessun articolo scansionato!", "error");
                maintainFocus();
                return;
            }

            // Ferma la camera se accesa
            if (state.isCameraActive) {
                await toggleCamera();
            }

            // Cambia vista
            els.scanPhase.classList.add('hidden');
            els.scanPhase.classList.remove('flex');
            els.summaryPhase.classList.remove('hidden');
            els.summaryPhase.classList.add('flex');

            // Renderizza lista
            els.summaryList.innerHTML = '';
            els.summaryTotalBadge.textContent = `${state.totalScans} pz totali`;

            const entries = Object.entries(state.eanCounts);
            // Ordina per quantità decrescente (opzionale)
            entries.sort((a, b) => b[1] - a[1]);

            entries.forEach(([ean, qty]) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-100";
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-50 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                            </svg>
                        </div>
                        <span class="font-mono text-lg font-bold text-slate-800">${ean}</span>
                    </div>
                    <div class="bg-slate-100 px-3 py-1 rounded-lg">
                        <span class="font-bold text-slate-700">${qty} pz</span>
                    </div>
                `;
                els.summaryList.appendChild(li);
            });
        }

        // Esporta/Copia dati negli appunti
        function exportData() {
            let textOutput = "EAN\tQuantità\n";
            Object.entries(state.eanCounts).forEach(([ean, qty]) => {
                textOutput += `${ean}\t${qty}\n`;
            });

            // Metodo fallback compatibile con browser vecchi e iFrame
            const textarea = document.createElement('textarea');
            textarea.value = textOutput;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast("Dati copiati negli appunti!", "success");
            } catch (err) {
                showToast("Errore nella copia dei dati", "error");
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Resetta tutto per un nuovo carico
        function resetApp() {
            // Reset stato
            state.eanCounts = {};
            state.totalScans = 0;

            // Reset UI Scansione
            els.lastScanned.textContent = '-';
            els.uniqueCount.textContent = '0';
            els.totalCount.textContent = '0';
            els.input.value = '';

            // Cambia vista
            els.summaryPhase.classList.add('hidden');
            els.summaryPhase.classList.remove('flex');
            els.scanPhase.classList.remove('hidden');
            els.scanPhase.classList.add('flex');

            showToast("Pronto per un nuovo carico!");
            maintainFocus();
        }

        // Start
        window.onload = init;

    </script>
</body>
</html>
